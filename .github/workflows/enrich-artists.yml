name: Enrich artists (Spotify)

# Reichert artists/ via Spotify an (Bild, Genre, Spotify-Link) und baut dann
# festivals.json. Läuft NUR manuell + wöchentlich – nicht bei jedem Push,
# weil die Anreicherung viele API-Anfragen macht.
# Datei-Pfad im Repo: .github/workflows/enrich-artists.yml
# Secrets: SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET

on:
  schedule:
    - cron: '0 4 * * 1'      # wöchentlich Montag 04:00 UTC – holt fehlende Bilder nach
  workflow_dispatch:          # manuell startbar

permissions:
  contents: write

# Nie zwei Anreicherungen gleichzeitig (sonst Spotify-Rate-Limit-Ärger).
concurrency:
  group: enrich-artists
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Künstler via Spotify anreichern
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          PYTHONUNBUFFERED: "1"          # Fortschritt live im Log statt gepuffert
        run: python3 -u enrich_artists.py

      # WICHTIG: erst die (teuer erkaufte) Spotify-Anreicherung sichern, BEVOR
      # gebaut wird. Läuft auch, wenn die Anreicherung mit Fehler endete
      # (if: always()), damit die bereits geholten Bilder nie verloren gehen.
      - name: Artists sofort sichern
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artists
          git diff --staged --quiet || git commit -m "Auto: Spotify-Anreicherung (Artists)"
          git push

      - name: festivals.json bauen (Join)
        run: python3 build_festivals.py

      - name: festivals.json committen (nur bei Änderung)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add festivals.json
          git diff --staged --quiet || git commit -m "Auto: Build festivals.json"
          git push
