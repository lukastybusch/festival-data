name: Build festivals.json

# Baut aus series/, artists/, affiliate/, genres.json und festivals/ die
# fertige festivals.json. Datei-Pfad im Repo: .github/workflows/merge-festivals.yml

on:
  push:
    branches: [ main ]
    paths:
      - 'festivals/**'
      - 'series/**'
      - 'artists/**'
      - 'affiliate/**'
      - 'genres.json'
      - 'build_festivals.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: festivals.json bauen (Join)
        run: python3 build_festivals.py

      - name: festivals.json committen (nur bei Änderung)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add festivals.json
          git diff --staged --quiet || git commit -m "Auto-build festivals.json"
          git push
