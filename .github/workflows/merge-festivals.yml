name: Enrich + Build festivals.json

# Reichert artists/ automatisch via Spotify an und baut daraus festivals.json.
# Datei-Pfad im Repo: .github/workflows/merge-festivals.yml
# Spotify-Zugangsdaten als Repository-Secrets hinterlegen:
#   SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET

on:
  push:
    branches: [ main ]
    paths:
      - 'festivals/**'
      - 'series/**'
      - 'artists/**'
      - 'affiliate/**'
      - 'genres.json'
      - '*.py'
  schedule:
    - cron: '0 4 * * 1'      # wöchentlich Montag 04:00 UTC – holt fehlende Bilder nach
  workflow_dispatch:          # manuell startbar

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Künstler via Spotify anreichern (optional)
        continue-on-error: true          # Build läuft auch, wenn Spotify mal hakt
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          if [ -n "$SPOTIFY_CLIENT_ID" ]; then
            python3 enrich_artists.py
          else
            echo "Keine Spotify-Secrets gesetzt – überspringe Anreicherung."
          fi

      - name: festivals.json bauen (Join)
        run: python3 build_festivals.py

      - name: Änderungen committen (nur bei Änderung)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artists festivals.json
          git diff --staged --quiet || git commit -m "Auto: Spotify-Anreicherung + Build"
          git push
