name: Build festivals.json

# Synchronisiert artists/ (ohne Spotify) und baut daraus + series/, affiliate/,
# genres.json und festivals/ die fertige festivals.json. Läuft bei jedem Daten-Push
# und manuell. Datei-Pfad im Repo: .github/workflows/merge-festivals.yml

on:
  push:
    branches: [ main ]
    paths:
      - 'festivals/**'
      - 'series/**'
      - 'artists/**'
      - 'affiliate/**'
      - 'genres.json'
      - 'build_festivals.py'
      - 'sync_artists.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Entfernt Spotify-Reste aus artists/ und legt für neue Line-up-Namen
      # automatisch Einträge an. Kein Netzwerk, keine Credentials.
      - name: Artists synchronisieren (ohne Spotify)
        run: python3 sync_artists.py

      - name: festivals.json bauen (Join)
        run: python3 build_festivals.py

      - name: Änderungen committen (nur bei Änderung)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artists festivals.json
          git diff --staged --quiet || git commit -m "Auto: Artists synchronisiert + festivals.json gebaut"
          git push
